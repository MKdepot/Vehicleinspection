<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แอดมิน • ระบบตรวจรถ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16211C; --muted:#5E6B64; --line:#DCE3DF; --bg:#F1F4F2; --surface:#fff;
    --pass:#0F7B4F; --pass-soft:#E4F2EB; --fail:#C22F2F; --fail-soft:#FBEAEA;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:inherit}
  body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;
       padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:22px;margin:0}
  h2{font-size:17px;margin:0 0 4px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  label.fld{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--muted)}
  input,select,button,textarea{font:inherit}
  input,select,textarea{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;width:100%;color:var(--ink)}
  textarea{min-height:110px}
  input[type=checkbox]{width:20px;height:20px;accent-color:var(--pass)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
  .btn{background:var(--pass);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.sm{padding:6px 12px;font-size:13px}
  .btn:disabled{opacity:.5}
  button:focus-visible,input:focus,select:focus,textarea:focus{outline:3px solid #9ED3BC;outline-offset:1px}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;color:var(--muted)}
  .tabs button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tbl{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
  tbody tr.click:hover{background:#F7FAF8;cursor:pointer}
  .tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
  .tag.p{background:var(--pass-soft);color:var(--pass)} .tag.f{background:var(--fail-soft);color:var(--fail)}
  .plate{font-weight:700;letter-spacing:.08em;font-size:17px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;cursor:default}
  button.stat{cursor:pointer}
  button.stat[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .stat b{display:block;font-size:28px;line-height:1.2}
  .stat span{font-size:13px;color:var(--muted)}
  .stat.f b{color:var(--fail)} .stat.p b{color:var(--pass)}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--fail)}
  .mut{color:var(--muted)}
  .hide{display:none!important}

  /* dashboard tiles */
  .progress{height:10px;background:var(--line);border-radius:5px;overflow:hidden;display:flex;margin:4px 0 18px}
  .progress i{display:block;height:100%}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .tile{border-radius:12px;padding:12px 10px;border:1.5px solid var(--line);background:#fff;text-align:center;font:inherit;color:var(--ink)}
  .tile .no{font-size:24px;font-weight:700;letter-spacing:.08em;line-height:1.2}
  .tile .st{font-size:12px;font-weight:600;margin-top:2px}
  .tile .tm{font-size:12px;color:var(--muted)}
  .tile.pass{background:var(--pass-soft);border-color:#B7DCC9;cursor:pointer}
  .tile.pass .st{color:var(--pass)}
  .tile.fail{background:var(--fail);border-color:var(--fail);color:#fff;cursor:pointer}
  .tile.fail .tm{color:#FBDADA}
  .tile.wait{border-style:dashed;background:transparent}
  .tile.wait .st{color:var(--muted)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:14px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

  .tile .rp{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;background:#FFEFD2;color:#7A4600;border-radius:999px;padding:1px 8px}
  .tile.fail .rp{background:#fff;color:var(--fail)}
  .tag.w{background:#FFEFD2;color:#7A4600}
  .late{color:var(--fail);font-weight:700}
  .stat.w b{color:#B26A00}
  dialog{border:0;border-radius:14px;padding:0;max-width:720px;width:94%;background:var(--surface)}
  dialog::backdrop{background:rgba(0,0,0,.5)}
  .dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
  .db{padding:16px;max-height:72vh;overflow:auto}
  .row{padding:10px 0;border-bottom:1px solid var(--line)}
  .row.f{background:var(--fail-soft);border-radius:8px;padding:12px;margin:8px 0;border-bottom:0}
  .shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .shots img{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
  .empty{text-align:center;padding:44px;color:var(--muted)}
  #gate{max-width:340px;margin:16vh auto;text-align:center}
</style>
</head>
<body>

<div id="gate" class="wrap">
  <h1 style="margin-bottom:16px">หน้าแอดมิน</h1>
  <div class="card">
    <label class="fld" for="pin">รหัสผ่าน</label>
    <input id="pin" type="password" inputmode="numeric" placeholder="••••">
    <button class="btn" id="btn-pin" style="width:100%;margin-top:12px">เข้าสู่ระบบ</button>
    <p id="pin-err" class="hide" style="color:var(--fail);font-size:13px">รหัสไม่ถูกต้อง</p>
  </div>
  <a href="./index.html" class="mut" style="font-size:14px">กลับหน้าตรวจรถ</a>
</div>

<main id="app" class="wrap hide">
  <div class="top">
    <h1>ระบบตรวจรถ</h1>
    <a href="./index.html" class="btn ghost sm" style="text-decoration:none">หน้าตรวจรถ</a>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true"  data-tab="day">ภาพรวมรายวัน</button>
    <button role="tab" aria-selected="false" data-tab="rep">รอซ่อม</button>
    <button role="tab" aria-selected="false" data-tab="insp">ประวัติการตรวจ</button>
    <button role="tab" aria-selected="false" data-tab="item">แยกตามรายการตรวจ</button>
    <button role="tab" aria-selected="false" data-tab="veh">แยกตามคัน</button>
    <button role="tab" aria-selected="false" data-tab="exp">ส่งออกข้อมูล</button>
    <button role="tab" aria-selected="false" data-tab="cars">จัดการรถ</button>
  </div>

  <!-- ===== ภาพรวมรายวัน ===== -->
  <section id="pane-day">
    <div class="card">
      <div class="grid">
        <div><label class="fld" for="d-date">วันที่</label><input id="d-date" type="date"></div>
        <div><button class="btn ghost" id="d-today" style="width:100%">วันนี้</button></div>
        <div><button class="btn" id="d-load" style="width:100%">รีเฟรช</button></div>
      </div>
      <p class="mut" id="d-updated" style="font-size:13px;margin:10px 0 0"></p>
    </div>
    <div class="stats" id="d-stats"></div>
    <div class="card">
      <div class="progress" id="d-progress"></div>
      <div class="tiles" id="d-tiles"></div>
      <div class="legend">
        <span><i style="background:var(--pass-soft);border:1px solid #B7DCC9"></i>ผ่าน</span>
        <span><i style="background:var(--fail)"></i>ไม่ผ่าน</span>
        <span><i style="border:1.5px dashed var(--muted)"></i>ยังไม่ตรวจ</span>
      </div>
    </div>
  </section>

  <!-- ===== รอซ่อม ===== -->
  <section id="pane-rep" class="hide">
    <div class="stats" id="r-stats"></div>
    <div class="card">
      <div class="grid">
        <div><label class="fld" for="r-status">สถานะ</label>
          <select id="r-status"><option value="open">รอซ่อม</option><option value="fixed">ซ่อมเสร็จแล้ว</option><option value="">ทั้งหมด</option></select></div>
        <div><label class="fld" for="r-plate">เบอร์รถ</label><select id="r-plate"><option value="">ทุกคัน</option></select></div>
        <div><button class="btn" id="r-load" style="width:100%">ดูข้อมูล</button></div>
        <div><button class="btn ghost" id="r-export" style="width:100%">ส่งออกรายการนี้</button></div>
      </div>
    </div>
    <div class="card tbl" id="r-list"></div>
  </section>

  <!-- ===== ตัวกรองช่วงวันที่ (ใช้กับแท็บประวัติ/รายการ/คัน/ส่งออก) ===== -->
  <div id="range" class="hide">
    <div class="card">
      <div class="grid">
        <div><label class="fld" for="f-from">ตั้งแต่วันที่</label><input id="f-from" type="date"></div>
        <div><label class="fld" for="f-to">ถึงวันที่</label><input id="f-to" type="date"></div>
        <div><label class="fld" for="f-plate">เบอร์รถ</label>
          <select id="f-plate"><option value="">ทุกคัน</option></select></div>
        <div><label class="fld" for="f-status">ผลการตรวจ</label>
          <select id="f-status"><option value="">ทั้งหมด</option><option value="fail">เฉพาะที่ไม่ผ่าน</option><option value="pass">เฉพาะที่ผ่าน</option></select></div>
        <div><button class="btn" id="btn-load" style="width:100%">ดูข้อมูล</button></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost sm" data-quick="today">วันนี้</button>
        <button class="btn ghost sm" data-quick="7">7 วันล่าสุด</button>
        <button class="btn ghost sm" data-quick="month">เดือนนี้</button>
        <button class="btn ghost sm" data-quick="lastmonth">เดือนที่แล้ว</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="card tbl hide" id="pane-insp"></div>
  <div class="card tbl hide" id="pane-item"></div>
  <div class="card tbl hide" id="pane-veh"></div>
  <div class="card hide" id="pane-exp">
    <h2>ส่งออกเป็นไฟล์ CSV (เปิดด้วย Excel ได้)</h2>
    <p class="mut" style="margin:0 0 16px;font-size:14px">ใช้ช่วงวันที่ด้านบนเป็นเกณฑ์</p>
    <div class="grid">
      <div><button class="btn" id="ex-sum" style="width:100%">สรุปรายใบตรวจ (ทุกคัน)</button></div>
      <div><button class="btn" id="ex-all" style="width:100%">รายละเอียดทุกข้อ (ทุกคัน)</button></div>
      <div><button class="btn" id="ex-fail" style="width:100%">เฉพาะข้อที่ไม่ผ่าน</button></div>
      <div><button class="btn" id="ex-rep" style="width:100%">งานซ่อม (แจ้ง/ซ่อมเสร็จในช่วงนี้)</button></div>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
    <div class="grid">
      <div><label class="fld" for="ex-plate">เลือกคัน</label><select id="ex-plate"><option value="">— เลือก —</option></select></div>
      <div><button class="btn ghost" id="ex-one" style="width:100%">ส่งออกรายคัน</button></div>
    </div>
  </div>

  <!-- ===== จัดการรถ ===== -->
  <section id="pane-cars" class="hide">
    <div class="card">
      <h2>เพิ่มรถ</h2>
      <p class="mut" style="margin:0 0 10px;font-size:14px">บรรทัดละ 1 คัน รูปแบบ <b>เบอร์รถ, ทะเบียน, ประเภท</b> — ถ้าเบอร์ซ้ำจะอัปเดตข้อมูลเดิม</p>
      <textarea id="c-bulk" placeholder="101, 70-1234, เทรลเลอร์&#10;102, 70-5678, สิบล้อ&#10;103"></textarea>
      <button class="btn" id="c-add" style="margin-top:10px">บันทึกรายชื่อรถ</button>
    </div>
    <div class="card tbl" id="c-list"></div>
  </section>
</main>

<dialog id="dlg">
  <div class="dh"><b id="dlg-title"></b><button class="btn ghost sm" onclick="document.getElementById('dlg').close()">ปิด</button></div>
  <div class="db" id="dlg-body"></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
(function(){
  'use strict';
  const C = window.CONFIG;
  const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  let DATA = { insp:[], res:{}, photos:{} };     // ชุดข้อมูลแท็บช่วงวันที่
  let DAY  = { insp:[], res:{}, photos:{} };     // ชุดข้อมูลแท็บรายวัน
  let VEH  = [];                                 // ทะเบียนรถทั้งหมด
  let dayFilter = 'all';
  let OPEN = {};                                 // เบอร์รถ -> จำนวนงานรอซ่อม
  let REP = [];                                  // รายการในแท็บรอซ่อม
  let rangeLoaded = false, timer = null;

  // ---------- gate ----------
  function open(){
    $('#gate').classList.add('hide'); $('#app').classList.remove('hide');
    $('#d-date').value = today(); setQuick('month');
    loadVehicles().then(loadDay).then(openFromLink);
    timer = setInterval(()=>{ if(!$('#pane-day').classList.contains('hide') && $('#d-date').value===today()) loadDay(); }, 60000);
  }

  // เปิดจากปุ่มในการ์ดแจ้งเตือน LINE: admin.html?id=<inspection_id>
  async function openFromLink(){
    const id = new URLSearchParams(location.search).get('id');
    if(!id) return;
    try{
      const { data, error } = await sb.from('inspections').select('*').eq('id', id).maybeSingle();
      if(error) throw error;
      if(!data) return alert('ไม่พบใบตรวจนี้ อาจถูกลบไปแล้ว');
      $('#d-date').value = data.inspect_date; await loadDay();
      detail(id, await withDetails([data]));
    }catch(e){ alert('เปิดใบตรวจไม่สำเร็จ: ' + (e.message||e)); }
    history.replaceState(null, '', location.pathname);
  }
  $('#btn-pin').onclick = ()=>{
    if($('#pin').value === String(C.ADMIN_PIN)){ sessionStorage.setItem('vi_admin','1'); open(); }
    else $('#pin-err').classList.remove('hide');
  };
  $('#pin').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#btn-pin').click(); });

  // ---------- helpers ----------
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const today = ()=> iso(new Date());
  const chunk = (a,n)=> a.reduce((o,v,i)=>(i%n ? o[o.length-1].push(v) : o.push([v]), o), []);
  const fmt = ts => new Date(ts).toLocaleString('th-TH',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'});
  const hm  = ts => new Date(ts).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  const stat = (v,l,cls,key)=> key
    ? '<button class="stat '+(cls||'')+'" data-f="'+key+'" aria-pressed="'+(dayFilter===key)+'"><b>'+v+'</b><span>'+l+'</span></button>'
    : '<div class="stat '+(cls||'')+'"><b>'+v+'</b><span>'+l+'</span></div>';

  // ดึงผลรายข้อ + รูป แยกตาราง แล้วจับคู่ด้วย Map (เสถียรกว่า join)
  async function withDetails(insp){
    const set = { insp, res:{}, photos:{} };
    const ids = insp.map(i=>i.id);
    for(const part of chunk(ids, 100)){
      const r = await sb.from('inspection_results').select('*').in('inspection_id', part).order('sort_order');
      if(r.error) throw r.error;
      r.data.forEach(x=> (set.res[x.inspection_id] = set.res[x.inspection_id] || []).push(x));
      const p = await sb.from('inspection_photos').select('*').in('inspection_id', part);
      if(p.error) throw p.error;
      p.data.forEach(x=> (set.photos[x.result_id] = set.photos[x.result_id] || []).push(x));
    }
    return set;
  }

  // ---------- tabs ----------
  document.querySelectorAll('[data-tab]').forEach(b=> b.onclick = ()=>{
    const t = b.dataset.tab;
    document.querySelectorAll('[data-tab]').forEach(x=> x.setAttribute('aria-selected', String(x===b)));
    ['day','rep','insp','item','veh','exp','cars'].forEach(k=> $('#pane-'+k).classList.toggle('hide', k!==t));
    $('#range').classList.toggle('hide', !['insp','item','veh','exp'].includes(t));
    if(t==='day') loadDay();
    if(['insp','item','veh','exp'].includes(t) && !rangeLoaded) load();
    if(t==='cars') renderCars();
    if(t==='rep') loadRepairs();
  });

  // ================= ภาพรวมรายวัน =================
  $('#d-today').onclick = ()=>{ $('#d-date').value = today(); loadDay(); };
  $('#d-load').onclick = loadDay;
  $('#d-date').onchange = loadDay;

  async function loadDay(){
    try{
      const { data, error } = await sb.from('inspections').select('*')
        .eq('inspect_date', $('#d-date').value).order('inspected_at', { ascending:false });
      if(error) throw error;
      DAY = await withDetails(data);
      const od = await sb.from('defects').select('vehicle_number').eq('status','open');
      OPEN = {}; (od.data||[]).forEach(x=> OPEN[x.vehicle_number] = (OPEN[x.vehicle_number]||0) + 1);
      renderDay();
      $('#d-updated').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH') +
        ($('#d-date').value===today() ? ' • รีเฟรชอัตโนมัติทุก 1 นาที' : '');
    }catch(e){ alert('โหลดข้อมูลไม่สำเร็จ: ' + (e.message||e)); }
  }

  function renderDay(){
    // ใช้ใบตรวจล่าสุดของแต่ละคันในวันนั้น
    const latest = {};
    DAY.insp.forEach(i=>{ if(!latest[i.vehicle_number]) latest[i.vehicle_number] = i; });
    const active = VEH.filter(v=>v.active);
    const tiles = active.map(v=>({ v:v.vehicle_number, car:v, i:latest[v.vehicle_number]||null }));
    // รถที่ตรวจแต่ไม่อยู่ในทะเบียน
    Object.keys(latest).forEach(k=>{ if(!active.find(v=>v.vehicle_number===k)) tiles.push({ v:k, car:null, i:latest[k] }); });
    tiles.sort((a,b)=> a.v.localeCompare(b.v));

    const total = active.length;
    const done  = tiles.filter(t=>t.i && t.car).length;
    const fail  = tiles.filter(t=>t.i && t.i.status==='fail').length;
    const wait  = tiles.filter(t=>!t.i).length;
    $('#d-stats').innerHTML =
      stat(total,'รถทั้งหมด','', 'all') + stat(done,'ตรวจแล้ว','p','done') +
      stat(wait,'ยังไม่ตรวจ','', 'wait') + stat(fail,'ตรวจไม่ผ่าน','f','fail') +
      '<button class="stat w" id="d-go-rep"><b>'+Object.values(OPEN).reduce((a,b)=>a+b,0)+'</b><span>งานรอซ่อม (ทุกคัน) →</span></button>';
    document.querySelectorAll('#d-stats [data-f]').forEach(b=> b.onclick = ()=>{ dayFilter = b.dataset.f; renderDay(); });
    $('#d-go-rep').onclick = ()=> document.querySelector('[data-tab=rep]').click();

    const pct = n => total ? (n/total*100) : 0;
    const passN = tiles.filter(t=>t.i && t.i.status==='pass' && t.car).length;
    const failN = tiles.filter(t=>t.i && t.i.status==='fail' && t.car).length;
    $('#d-progress').innerHTML = '<i style="width:'+pct(passN)+'%;background:var(--pass)"></i><i style="width:'+pct(failN)+'%;background:var(--fail)"></i>';

    const shown = tiles.filter(t=>
      dayFilter==='all' ? true :
      dayFilter==='done' ? !!t.i :
      dayFilter==='wait' ? !t.i :
      (t.i && t.i.status==='fail'));
    if(!VEH.length){
      $('#d-tiles').innerHTML = '<div class="empty" style="grid-column:1/-1">ยังไม่มีทะเบียนรถ — เพิ่มได้ที่แท็บ “จัดการรถ”</div>'; return;
    }
    if(!shown.length){ $('#d-tiles').innerHTML = '<div class="empty" style="grid-column:1/-1">ไม่มีรถในกลุ่มนี้</div>'; return; }
    $('#d-tiles').innerHTML = shown.map(t=>{
      const rp = OPEN[t.v] ? '<div class="rp">รอซ่อม '+OPEN[t.v]+'</div>' : '';
      if(!t.i) return '<div class="tile wait"><div class="no">'+esc(t.v)+'</div><div class="st">ยังไม่ตรวจ</div><div class="tm">'+esc(t.car.vehicle_type||'')+'</div>'+rp+'</div>';
      const f = t.i.status==='fail';
      return '<button class="tile '+(f?'fail':'pass')+'" data-id="'+t.i.id+'"><div class="no">'+esc(t.v)+'</div>'+
        '<div class="st">'+(f ? 'ไม่ผ่าน '+t.i.fail_count+' ข้อ' : 'ผ่าน')+'</div>'+
        '<div class="tm">'+hm(t.i.inspected_at)+(t.car?'':' • ไม่มีในทะเบียน')+'</div>'+rp+'</button>';
    }).join('');
    document.querySelectorAll('#d-tiles [data-id]').forEach(b=> b.onclick = ()=> detail(b.dataset.id, DAY));
  }

  // ================= ช่วงวันที่ =================
  function setQuick(k){
    const now = new Date(); let a, b;
    if(k==='today'){ a=b=now; }
    else if(k==='7'){ b=now; a=new Date(now.getTime()-6*864e5); }
    else if(k==='month'){ a=new Date(now.getFullYear(),now.getMonth(),1); b=new Date(now.getFullYear(),now.getMonth()+1,0); }
    else { a=new Date(now.getFullYear(),now.getMonth()-1,1); b=new Date(now.getFullYear(),now.getMonth(),0); }
    $('#f-from').value = iso(a); $('#f-to').value = iso(b);
  }
  document.querySelectorAll('[data-quick]').forEach(b=> b.onclick = ()=>{ setQuick(b.dataset.quick); load(); });
  $('#btn-load').onclick = load;

  async function load(){
    $('#btn-load').disabled = true; $('#btn-load').textContent = 'กำลังโหลด…';
    try{
      let q = sb.from('inspections').select('*')
        .gte('inspect_date', $('#f-from').value).lte('inspect_date', $('#f-to').value)
        .order('inspected_at', { ascending:false });
      if($('#f-plate').value)  q = q.eq('vehicle_number', $('#f-plate').value);
      if($('#f-status').value) q = q.eq('status', $('#f-status').value);
      const { data, error } = await q;
      if(error) throw error;
      DATA = await withDetails(data);
      rangeLoaded = true;
      renderStats(); renderInsp(); renderItem(); renderVeh();
    }catch(e){ alert('โหลดข้อมูลไม่สำเร็จ: ' + (e.message||e)); }
    finally{ $('#btn-load').disabled = false; $('#btn-load').textContent = 'ดูข้อมูล'; }
  }

  function renderStats(){
    const n = DATA.insp.length;
    const f = DATA.insp.filter(i=>i.status==='fail').length;
    const veh = new Set(DATA.insp.map(i=>i.vehicle_number)).size;
    const failItems = Object.values(DATA.res).flat().filter(r=>r.result==='fail').length;
    $('#stats').innerHTML = stat(n,'ใบตรวจทั้งหมด') + stat(veh,'จำนวนคัน') + stat(f,'ใบที่มีข้อไม่ผ่าน','f') + stat(failItems,'ข้อที่ไม่ผ่านรวม','f');
  }

  function renderInsp(){
    const el = $('#pane-insp');
    if(!DATA.insp.length) return el.innerHTML = '<div class="empty">ไม่มีข้อมูลในช่วงวันที่ที่เลือก</div>';
    el.innerHTML = '<table><thead><tr><th>วัน–เวลา</th><th>เบอร์รถ</th><th>ผู้ตรวจ</th><th>ผล</th><th>ไม่ผ่าน</th><th>ความผิดปกติอื่น ๆ</th></tr></thead><tbody>'+
      DATA.insp.map(i=>
        '<tr class="click" data-id="'+i.id+'"><td>'+fmt(i.inspected_at)+'</td>'+
        '<td class="plate">'+esc(i.vehicle_number)+'</td><td>'+esc(i.inspector_name)+'</td>'+
        '<td><span class="tag '+(i.status==='fail'?'f':'p')+'">'+(i.status==='fail'?'ไม่ผ่าน':'ผ่าน')+'</span></td>'+
        '<td>'+(i.fail_count||0)+' ข้อ</td><td class="mut">'+esc(i.other_note||'–')+'</td></tr>').join('')+
      '</tbody></table>';
    el.querySelectorAll('tr[data-id]').forEach(tr=> tr.onclick = ()=> detail(tr.dataset.id, DATA));
  }

  function renderItem(){
    const by = {};
    Object.values(DATA.res).flat().forEach(r=>{
      const k = r.item_code;
      by[k] = by[k] || { code:r.item_code, label:r.item_label, section:r.section_name, total:0, fail:0, items:[] };
      by[k].total++;
      if(r.result==='fail'){ by[k].fail++; by[k].items.push(r); }
    });
    const list = Object.values(by).sort((a,b)=> b.fail-a.fail || a.code.localeCompare(b.code));
    const el = $('#pane-item');
    if(!list.length) return el.innerHTML = '<div class="empty">ไม่มีข้อมูล</div>';
    el.innerHTML = '<table><thead><tr><th>ข้อ</th><th>รายการตรวจ</th><th>ตรวจ</th><th>ไม่ผ่าน</th><th style="width:130px">สัดส่วน</th></tr></thead><tbody>'+
      list.map(x=>
        '<tr class="click" data-code="'+esc(x.code)+'"><td><b>'+esc(x.code)+'</b></td><td>'+esc(x.label)+'<div class="mut" style="font-size:12px">'+esc(x.section)+'</div></td>'+
        '<td>'+x.total+'</td><td>'+(x.fail?'<b style="color:var(--fail)">'+x.fail+'</b>':'0')+'</td>'+
        '<td><div class="bar"><i style="width:'+Math.round(x.fail/x.total*100)+'%"></i></div></td></tr>').join('')+
      '</tbody></table>';
    el.querySelectorAll('tr[data-code]').forEach(tr=> tr.onclick = ()=> itemDetail(by[tr.dataset.code]));
  }

  function renderVeh(){
    const by = {};
    DATA.insp.forEach(i=>{
      const k = i.vehicle_number;
      by[k] = by[k] || { v:k, n:0, fail:0, items:0, last:null };
      by[k].n++; if(i.status==='fail') by[k].fail++;
      by[k].items += (i.fail_count||0);
      if(!by[k].last || i.inspected_at > by[k].last) by[k].last = i.inspected_at;
    });
    const list = Object.values(by).sort((a,b)=> b.items-a.items || a.v.localeCompare(b.v));
    const el = $('#pane-veh');
    if(!list.length) return el.innerHTML = '<div class="empty">ไม่มีข้อมูล</div>';
    el.innerHTML = '<table><thead><tr><th>เบอร์รถ</th><th>จำนวนครั้งที่ตรวจ</th><th>ใบที่มีข้อไม่ผ่าน</th><th>ข้อไม่ผ่านรวม</th><th>ตรวจล่าสุด</th></tr></thead><tbody>'+
      list.map(x=> '<tr class="click" data-v="'+esc(x.v)+'"><td class="plate">'+esc(x.v)+'</td><td>'+x.n+'</td><td>'+x.fail+'</td>'+
        '<td>'+(x.items?'<b style="color:var(--fail)">'+x.items+'</b>':'0')+'</td><td>'+fmt(x.last)+'</td></tr>').join('')+
      '</tbody></table>';
    el.querySelectorAll('tr[data-v]').forEach(tr=> tr.onclick = ()=>{
      $('#f-plate').value = tr.dataset.v;
      document.querySelector('[data-tab=insp]').click();
      load();
    });
  }

  // ---------- popup ----------
  function shots(set, resultId){
    const ps = set.photos[resultId] || [];
    if(!ps.length) return '';
    return '<div class="shots">' + ps.map(p=>'<img src="'+esc(p.url)+'" alt="รูปประกอบ" onclick="window.open(this.src)">').join('') + '</div>';
  }
  function detail(id, set){
    const i = set.insp.find(x=>x.id===id);
    const rows = set.res[id] || [];
    $('#dlg-title').textContent = 'รถ ' + i.vehicle_number + ' • ' + fmt(i.inspected_at);
    $('#dlg-body').innerHTML =
      '<p class="mut" style="margin-top:0">ผู้ตรวจ: '+esc(i.inspector_name||'-')+' • ไม่ผ่าน '+(i.fail_count||0)+' ข้อ'+
      (i.notified_at ? ' • แจ้งเตือนกลุ่มแล้ว '+hm(i.notified_at) : '')+
      (i.other_note ? '<br>ความผิดปกติอื่น ๆ: '+esc(i.other_note) : '')+'</p>'+
      rows.map(r=> r.result==='fail'
        ? '<div class="row f"><b>'+esc(r.item_code+' '+r.item_label)+'</b> <span class="tag f">ไม่ผ่าน</span>'+
          '<div style="margin-top:4px">'+esc(r.detail||'ไม่ได้ระบุรายละเอียด')+'</div>'+ shots(set, r.id) +'</div>'
        : '<div class="row"><span class="mut">'+esc(r.item_code)+'</span> '+esc(r.item_label)+' <span class="tag p">ผ่าน</span></div>'
      ).join('');
    $('#dlg').showModal();
  }
  function itemDetail(x){
    $('#dlg-title').textContent = x.code + ' ' + x.label;
    if(!x.items.length){ $('#dlg-body').innerHTML = '<div class="empty">ไม่มีรายการไม่ผ่านในช่วงนี้</div>'; return $('#dlg').showModal(); }
    $('#dlg-body').innerHTML = x.items.map(r=>{
      const i = DATA.insp.find(v=>v.id===r.inspection_id) || {};
      return '<div class="row f"><b class="plate">'+esc(i.vehicle_number)+'</b> <span class="mut">'+fmt(i.inspected_at)+' • '+esc(i.inspector_name)+'</span>'+
        '<div style="margin-top:4px">'+esc(r.detail||'ไม่ได้ระบุรายละเอียด')+'</div>'+ shots(DATA, r.id) +'</div>';
    }).join('');
    $('#dlg').showModal();
  }

  // ---------- export ----------
  function csv(rows, name){
    const q = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
    const blob = new Blob(['\uFEFF' + rows.map(r=> r.map(q).join(',')).join('\r\n')], { type:'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (name.endsWith('.csv') ? name : name + '_' + $('#f-from').value + '_ถึง_' + $('#f-to').value + '.csv');
    a.click(); setTimeout(()=> URL.revokeObjectURL(a.href), 1000);
  }
  function detailRows(filterFail, plate){
    const out = [['วันที่','เวลา','เบอร์รถ','ทะเบียน','ผู้ตรวจ','ผลรวมของใบตรวจ','หมวด','ข้อ','รายการตรวจ','ผล','รายละเอียดที่พบ','จำนวนรูป','ลิงก์รูป','ความผิดปกติอื่น ๆ']];
    DATA.insp.filter(i=> !plate || i.vehicle_number===plate).forEach(i=>{
      const d = new Date(i.inspected_at);
      const car = VEH.find(v=>v.vehicle_number===i.vehicle_number) || {};
      (DATA.res[i.id]||[]).forEach(r=>{
        if(filterFail && r.result!=='fail') return;
        const ps = DATA.photos[r.id] || [];
        out.push([ d.toLocaleDateString('th-TH'), hm(i.inspected_at), i.vehicle_number, car.plate||'', i.inspector_name,
          i.status==='fail'?'ไม่ผ่าน':'ผ่าน', r.section_name, r.item_code, r.item_label, r.result==='fail'?'ไม่ผ่าน':'ผ่าน',
          r.detail||'', ps.length, ps.map(p=>p.url).join(' | '), i.other_note||'' ]);
      });
    });
    return out;
  }
  $('#ex-sum').onclick = ()=>{
    const out = [['วันที่','เวลา','เบอร์รถ','ทะเบียน','ผู้ตรวจ','ผล','จำนวนข้อไม่ผ่าน','ข้อที่ไม่ผ่าน','ความผิดปกติอื่น ๆ']];
    DATA.insp.forEach(i=>{
      const car = VEH.find(v=>v.vehicle_number===i.vehicle_number) || {};
      const f = (DATA.res[i.id]||[]).filter(r=>r.result==='fail').map(r=>r.item_code).join(', ');
      out.push([ new Date(i.inspected_at).toLocaleDateString('th-TH'), hm(i.inspected_at), i.vehicle_number, car.plate||'',
        i.inspector_name, i.status==='fail'?'ไม่ผ่าน':'ผ่าน', i.fail_count||0, f, i.other_note||'' ]);
    });
    csv(out, 'สรุปการตรวจรถ');
  };
  $('#ex-all').onclick  = ()=> csv(detailRows(false), 'รายละเอียดการตรวจรถ');
  $('#ex-fail').onclick = ()=> csv(detailRows(true), 'รายการที่ไม่ผ่าน');
  $('#ex-one').onclick  = ()=>{
    const p = $('#ex-plate').value;
    if(!p) return alert('เลือกเบอร์รถก่อน');
    csv(detailRows(false, p), 'ตรวจรถ_เบอร์'+p);
  };

  // ================= รอซ่อม =================
  const bkkDate = (d=new Date())=> d.toLocaleDateString('en-CA', { timeZone:'Asia/Bangkok' });
  const daysBetween = (a,b)=> Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
  const thDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}) : '–';
  const waitDays = d => d.status==='fixed' ? d.days_waiting : daysBetween(d.first_date, bkkDate());
  $('#r-load').onclick = loadRepairs;
  $('#r-status').onchange = loadRepairs;
  $('#r-plate').onchange = loadRepairs;

  async function loadRepairs(){
    try{
      let q = sb.from('defects').select('*');
      const st = $('#r-status').value;
      if(st) q = q.eq('status', st);
      if($('#r-plate').value) q = q.eq('vehicle_number', $('#r-plate').value);
      q = st==='open' ? q.order('first_date', { ascending:true }) : q.order('first_reported_at', { ascending:false }).limit(500);
      const { data, error } = await q;
      if(error) throw error;
      REP = data || [];
      renderRepairs();
      // สถิติ
      const m1 = bkkDate().slice(0,8) + '01';
      const [op, fx] = await Promise.all([
        sb.from('defects').select('first_date').eq('status','open'),
        sb.from('defects').select('days_waiting').eq('status','fixed').gte('fixed_date', m1)
      ]);
      const opn = op.data||[], fxd = fx.data||[];
      const late = opn.filter(d=> daysBetween(d.first_date, bkkDate()) >= 3).length;
      const avg = fxd.length ? (fxd.reduce((a,d)=>a+(d.days_waiting||0),0)/fxd.length).toFixed(1) : '–';
      $('#r-stats').innerHTML = stat(opn.length,'รอซ่อมทั้งหมด','w') + stat(late,'รอเกิน 3 วัน','f') +
        stat(fxd.length,'ซ่อมเสร็จเดือนนี้','p') + stat(avg,'เฉลี่ยวันรอซ่อม (เดือนนี้)');
    }catch(e){ alert('โหลดรายการซ่อมไม่สำเร็จ: ' + (e.message||e)); }
  }

  function renderRepairs(){
    const el = $('#r-list');
    if(!REP.length) return el.innerHTML = '<div class="empty">'+($('#r-status').value==='open' ? 'ไม่มีงานค้างซ่อม 👍' : 'ไม่มีข้อมูล')+'</div>';
    el.innerHTML = '<table><thead><tr><th>เบอร์รถ</th><th>รายการ</th><th>อาการที่แจ้ง</th><th>แจ้งครั้งแรก</th><th>รอ (วัน)</th><th>สถานะ</th><th></th></tr></thead><tbody>'+
      REP.map(d=>{
        const w = waitDays(d);
        const stc = d.status==='open'
          ? '<span class="tag w">รอซ่อม</span><div class="mut" style="font-size:12px">พบ '+(d.seen_count||1)+' ครั้ง</div>'
          : '<span class="tag p">ซ่อมเสร็จ</span><div class="mut" style="font-size:12px">'+thDate(d.fixed_date)+' • '+esc(d.fixed_by||'')+'</div>';
        return '<tr class="click" data-id="'+d.id+'"><td class="plate">'+esc(d.vehicle_number)+'</td>'+
          '<td><b>'+esc(d.item_code)+'</b> '+esc(d.item_label)+'</td><td>'+esc(d.first_detail||'–')+'</td>'+
          '<td>'+thDate(d.first_date)+'<div class="mut" style="font-size:12px">'+esc(d.reported_by||'')+'</div></td>'+
          '<td class="'+(d.status==='open' && w>=3 ? 'late' : '')+'">'+w+'</td><td>'+stc+'</td>'+
          '<td>'+(d.status==='open' ? '<button class="btn sm" data-fix="'+d.id+'">ซ่อมเสร็จ</button>' : '')+'</td></tr>';
      }).join('')+'</tbody></table>';
    el.querySelectorAll('tr[data-id]').forEach(tr=> tr.onclick = e=>{
      if(e.target.closest('[data-fix]')) return;
      repairDetail(tr.dataset.id);
    });
    el.querySelectorAll('[data-fix]').forEach(b=> b.onclick = ()=> repairDetail(b.dataset.fix, true));
  }

  async function repairDetail(id, focusFix){
    const d = REP.find(x=>x.id===id); if(!d) return;
    let pics = '';
    if(d.first_result_id){
      const { data } = await sb.from('inspection_photos').select('url').eq('result_id', d.first_result_id);
      pics = (data||[]).map(p=>'<img src="'+esc(p.url)+'" alt="รูปตอนแจ้ง" onclick="window.open(this.src)">').join('');
    }
    const w = waitDays(d);
    $('#dlg-title').textContent = 'รถ ' + d.vehicle_number + ' • ' + d.item_code + ' ' + d.item_label;
    let html =
      '<div class="row f"><b>อาการที่แจ้ง</b><div style="margin-top:4px">'+esc(d.first_detail||'ไม่ได้ระบุรายละเอียด')+'</div>'+
      (pics ? '<div class="shots">'+pics+'</div>' : '')+'</div>'+
      '<table style="margin-top:8px"><tbody>'+
      '<tr><th>วันที่แจ้งครั้งแรก</th><td>'+thDate(d.first_date)+' '+new Date(d.first_reported_at).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+' โดย '+esc(d.reported_by||'-')+'</td></tr>'+
      '<tr><th>ตรวจพบซ้ำ</th><td>'+(d.seen_count||1)+' ครั้ง • ล่าสุด '+fmt(d.last_seen_at)+'</td></tr>'+
      '<tr><th>จำนวนวันรอซ่อม</th><td><b>'+w+' วัน</b>'+(d.status==='open'?' (ยังไม่เสร็จ)':'')+'</td></tr>';
    if(d.status==='fixed'){
      html += '<tr><th>วันที่ซ่อมเสร็จ</th><td>'+thDate(d.fixed_date)+' โดย '+esc(d.fixed_by||'-')+
        ' ('+(d.fixed_source==='driver'?'พนง. กดตอนตรวจรถ':'แอดมิน')+')</td></tr>'+
        (d.fixed_note ? '<tr><th>หมายเหตุ</th><td>'+esc(d.fixed_note)+'</td></tr>' : '');
    }
    html += '</tbody></table>';
    if(d.status==='open'){
      html += '<div class="card" style="margin:16px 0 0;background:var(--pass-soft);border-color:#B7DCC9">'+
        '<h2>บันทึกซ่อมเสร็จ</h2>'+
        '<div class="grid" style="margin-top:10px">'+
          '<div><label class="fld" for="fx-date">วันที่ซ่อมเสร็จ</label><input id="fx-date" type="date" value="'+bkkDate()+'" min="'+d.first_date+'" max="'+bkkDate()+'"></div>'+
          '<div><label class="fld" for="fx-by">ผู้บันทึก</label><input id="fx-by" type="text" placeholder="ชื่อผู้ปิดงาน" value="'+esc(localStorage.getItem('vi_fixer')||'')+'"></div>'+
        '</div>'+
        '<label class="fld" for="fx-note" style="margin-top:10px">รายละเอียดการซ่อม / หมายเหตุ</label>'+
        '<textarea id="fx-note" placeholder="เช่น เปลี่ยนหลอดไฟเลี้ยวขวา อู่ ..." style="min-height:70px"></textarea>'+
        '<button class="btn" id="fx-save" style="margin-top:10px;width:100%">ยืนยันซ่อมเสร็จ</button></div>';
    }
    $('#dlg-body').innerHTML = html;
    $('#dlg').showModal();
    if(d.status==='open'){
      if(focusFix) $('#fx-note').focus();
      $('#fx-save').onclick = async ()=>{
        const date = $('#fx-date').value, by = $('#fx-by').value.trim();
        if(!date) return alert('เลือกวันที่ซ่อมเสร็จ');
        if(!by) return alert('กรอกชื่อผู้บันทึก');
        localStorage.setItem('vi_fixer', by);
        $('#fx-save').disabled = true;
        const at = date === bkkDate() ? new Date().toISOString() : date + 'T12:00:00+07:00';
        const { data, error } = await sb.from('defects').update({
          status:'fixed', fixed_date: date, fixed_at: at, fixed_by: by, fixed_source:'admin',
          fixed_note: $('#fx-note').value.trim() || null
        }).eq('id', d.id).eq('status','open').select('id');
        $('#fx-save').disabled = false;
        if(error) return alert('บันทึกไม่สำเร็จ: ' + error.message);
        if(!data || !data.length) alert('งานนี้ถูกปิดไปแล้วก่อนหน้านี้');
        $('#dlg').close();
        loadRepairs();
      };
    }
  }

  function repairCsv(list, name){
    const out = [['เบอร์รถ','ทะเบียน','ข้อ','รายการตรวจ','อาการที่แจ้ง','วันที่แจ้งครั้งแรก','ผู้แจ้ง','ตรวจพบซ้ำ (ครั้ง)','สถานะ','วันที่ซ่อมเสร็จ','ผู้ปิดงาน','ปิดงานจาก','จำนวนวันรอซ่อม','หมายเหตุการซ่อม']];
    list.forEach(d=>{
      const car = VEH.find(v=>v.vehicle_number===d.vehicle_number) || {};
      out.push([ d.vehicle_number, car.plate||'', d.item_code, d.item_label, d.first_detail||'',
        thDate(d.first_date), d.reported_by||'', d.seen_count||1, d.status==='open'?'รอซ่อม':'ซ่อมเสร็จ',
        d.status==='fixed'?thDate(d.fixed_date):'', d.fixed_by||'', d.fixed_source==='driver'?'พนง.':(d.fixed_source==='admin'?'แอดมิน':''),
        waitDays(d), d.fixed_note||'' ]);
    });
    csv(out, name);
  }
  $('#r-export').onclick = ()=> repairCsv(REP, 'งานซ่อม_' + bkkDate() + '.csv');
  $('#ex-rep').onclick = async ()=>{
    const a = $('#f-from').value, b = $('#f-to').value;
    const { data, error } = await sb.from('defects').select('*')
      .or('and(first_date.gte.'+a+',first_date.lte.'+b+'),and(fixed_date.gte.'+a+',fixed_date.lte.'+b+')')
      .order('first_date');
    if(error) return alert(error.message);
    repairCsv(data||[], 'งานซ่อม');
  };

  // ================= จัดการรถ =================
  async function loadVehicles(){
    const { data, error } = await sb.from('vehicles').select('*').order('vehicle_number');
    if(error){ alert('โหลดทะเบียนรถไม่สำเร็จ: ' + error.message); return; }
    VEH = data || [];
    const opts = VEH.map(v=> '<option>'+esc(v.vehicle_number)+'</option>').join('');
    $('#f-plate').innerHTML = '<option value="">ทุกคัน</option>' + opts;
    $('#ex-plate').innerHTML = '<option value="">— เลือก —</option>' + opts;
    $('#r-plate').innerHTML = '<option value="">ทุกคัน</option>' + opts;
  }

  function renderCars(){
    const el = $('#c-list');
    if(!VEH.length) return el.innerHTML = '<div class="empty">ยังไม่มีรถในระบบ</div>';
    el.innerHTML = '<table><thead><tr><th>เบอร์รถ</th><th>ทะเบียน</th><th>ประเภท</th><th>ใช้งาน</th><th></th></tr></thead><tbody>'+
      VEH.map(v=> '<tr><td class="plate">'+esc(v.vehicle_number)+'</td><td>'+esc(v.plate||'–')+'</td><td>'+esc(v.vehicle_type||'–')+'</td>'+
        '<td><input type="checkbox" data-act="'+esc(v.vehicle_number)+'" '+(v.active?'checked':'')+' aria-label="ใช้งานรถ '+esc(v.vehicle_number)+'"></td>'+
        '<td><button class="btn ghost sm" data-del="'+esc(v.vehicle_number)+'">ลบ</button></td></tr>').join('')+
      '</tbody></table><p class="mut" style="font-size:13px;margin:10px 0 0">ติ๊ก “ใช้งาน” ออก = ไม่นับใน dashboard และ พนง. จะกรอกเบอร์นี้ไม่ได้ (ประวัติเดิมยังอยู่)</p>';
    el.querySelectorAll('[data-act]').forEach(cb=> cb.onchange = async ()=>{
      const { error } = await sb.from('vehicles').update({ active: cb.checked }).eq('vehicle_number', cb.dataset.act);
      if(error){ alert(error.message); cb.checked = !cb.checked; return; }
      await loadVehicles();
    });
    el.querySelectorAll('[data-del]').forEach(b=> b.onclick = async ()=>{
      if(!confirm('ลบรถเบอร์ ' + b.dataset.del + ' ออกจากทะเบียน? (ประวัติการตรวจยังอยู่)')) return;
      const { error } = await sb.from('vehicles').delete().eq('vehicle_number', b.dataset.del);
      if(error) return alert(error.message);
      await loadVehicles(); renderCars();
    });
  }

  $('#c-add').onclick = async ()=>{
    const rows = [], bad = [];
    $('#c-bulk').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
      const [no, plate, type] = l.split(/[,\t]/).map(s=> (s||'').trim());
      if(!/^\d{3}$/.test(no)) return bad.push(l);
      rows.push({ vehicle_number:no, plate:plate||null, vehicle_type:type||null, active:true });
    });
    if(bad.length) return alert('เบอร์รถต้องเป็นตัวเลข 3 หลัก บรรทัดที่ผิด:\n' + bad.join('\n'));
    if(!rows.length) return alert('ยังไม่ได้กรอกข้อมูลรถ');
    const { error } = await sb.from('vehicles').upsert(rows, { onConflict:'vehicle_number' });
    if(error) return alert('บันทึกไม่สำเร็จ: ' + error.message);
    $('#c-bulk').value = '';
    await loadVehicles(); renderCars();
    alert('บันทึกรถ ' + rows.length + ' คันแล้ว');
  };

  // เข้าสู่ระบบค้างไว้ในแท็บนี้แล้ว → เปิดเลย (ต้องอยู่ท้ายสุด หลังประกาศตัวแปรทั้งหมด)
  if(sessionStorage.getItem('vi_admin')==='1') open();
})();
</script>
